
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#173D35">

    <meta name="description" content="CivicEvents — Discover events, connect with your community and stay informed about what's happening in your city.">

    <title>CivicEvents | Your City, Your Community</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
          href="assets/images/favicon.svg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#172522',
                        forest: '#173D35',
                        moss: '#527C68',
                        lime: '#D6EE9B',
                        paper: '#F7F8F4',
                        surface: '#FFFFFF',
                        muted: '#718078',
                        line: '#E6EAE3',
                        danger: '#DC5555',
                        warning: '#E5A642'
                    },

                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                        display: ['Manrope', 'sans-serif']
                    },

                    boxShadow: {
                        soft: '0 12px 40px rgba(23, 37, 34, 0.07)',
                        card: '0 4px 20px rgba(23, 37, 34, 0.05)'
                    },

                    borderRadius: {
                        '4xl': '2rem'
                    },

                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out'
                    },

                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },

                        slideUp: {
                            '0%': {
                                opacity: '0',
                                transform: 'translateY(15px)'
                            },
                            '100%': {
                                opacity: '1',
                                transform: 'translateY(0)'
                            }
                        }
                    }
                }
            }
        };
    </script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="assets/css/app.css">

    <!-- jQuery -->
    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
        crossorigin="anonymous">
    </script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body class="bg-paper text-ink font-sans antialiased">

    <!-- Main Application Container -->
    <div id="app">

        <!-- Initial Loading Screen -->
        <div class="min-h-screen flex items-center justify-center">

            <div class="text-center">

                <div class="brand-mark mx-auto mb-5">
                    C
                </div>

                <h1 class="font-display font-bold text-xl text-forest">
                    CivicEvents
                </h1>

                <p class="text-sm text-muted mt-2">
                    Preparing your city experience...
                </p>

                <div class="mt-6 flex justify-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-moss animate-bounce"></span>
                    <span class="w-2 h-2 rounded-full bg-moss animate-bounce [animation-delay:150ms]"></span>
                    <span class="w-2 h-2 rounded-full bg-moss animate-bounce [animation-delay:300ms]"></span>
                </div>

            </div>

        </div>

    </div>

    <!-- Application JavaScript -->
    <script type="module" src="assets/js/app.js"></script>

</body>
</html>
